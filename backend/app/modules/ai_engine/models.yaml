# Модели OpenRouter в порядке приоритета.
#
# ПРОВЕРЕНО ВЖИВУЮ 01.09.2026 реальными запросами на русском юридическом
# тексте. Методика и полные результаты: docs/MODEL_AUDIT.md
#
# Менять список можно без правки кода — роутер читает этот файл.
# Перепроверить актуальность: node scripts/check-models.js --all
#
# Поля:
#   id       — идентификатор модели в OpenRouter
#   priority — меньше = раньше пробуем
#   notes    — почему именно здесь

models:
  - id: minimax/minimax-m3:free
    priority: 1
    notes: >
      Лучший баланс. Русский 0.84-0.88, самый живой ритм (разброс длин
      предложений 12.3 — важно для humanizer, ровный ритм выдаёт ИИ),
      ссылки на нормы и практику. 2.9-4.4 с.

  - id: minimax/minimax-m2.7:free
    priority: 2
    notes: Тот же вендор, стабильный русский, чуть медленнее (3.7-8.6 с).

  - id: nvidia/nemotron-3-ultra-550b-a55b:free
    priority: 3
    notes: >
      Русский стабильный, много ссылок на нормы, но ритм ровнее
      (разброс 6.0) — текст суше. Периодически отдаёт 502 при перегрузе.

  - id: dots-studio/dots-3-note-preview:free
    priority: 4
    notes: >
      Русский хороший, но склонен к клише ("таким образом", "важно
      понимать") и к выдаче "Вариант 1 / Вариант 2" вместо готового текста.

  - id: poolside/laguna-s-2.1:free
    priority: 5
    notes: >
      Качественный русский (0.88-0.89), но нестабильная доступность —
      в тесте ответила 2 раза из 3. Держим последней.

# НЕ ДОБАВЛЯТЬ без повторной проверки — все эти варианты уже отбракованы:
#
#   nvidia/nemotron-3-super-120b-a12b:free
#       Стояла ПЕРВОЙ в исходном коде. Отдаёт 404 от Nvidia, а когда
#       отвечает — думает и пишет ПО-АНГЛИЙСКИ (кириллица 0.10).
#       Для русской курсовой непригодна.
#   deepseek/deepseek-v4-flash:free   — такого id на OpenRouter НЕ СУЩЕСТВУЕТ.
#   moonshotai/kimi-k2.6:free         — такого id на OpenRouter НЕ СУЩЕСТВУЕТ.
#   google/gemma-4-31b-it:free        — существует, но стабильный 429.
#   nvidia/nemotron-3.5-lightning:free
#   inclusionai/ling-3.0-flash-fin:free
#       Отвечают англоязычным reasoning вместо русского текста.
#   nvidia/nemotron-3.5-content-safety:free — модерационная, не генеративная.
#   cohere/north-mini-code:free       — код-модель, на прозе нестабильна.
#   thinkingmachines/inkling*:free    — 403 Forbidden.

# Настройки повторов и отказоустойчивости.
retry:
  # 429 от общего пула провайдера — временный, имеет смысл повторить.
  max_attempts_per_model: 2
  backoff_seconds: 5
  timeout_seconds: 180
  # Ниже этой доли кириллицы ответ считается браком (модель ушла в
  # англоязычный reasoning) и роутер переключается на следующую модель.
  min_cyrillic_ratio: 0.6
